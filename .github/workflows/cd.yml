name: "Weekly Continuous Deployment (CD)"

on:
  schedule:
    # Every Thursday at 06:00 UTC for weekend planning & release
    - cron: "0 6 * * 4"
  workflow_dispatch:
    inputs:
      target_weekend:
        description: "Target weekend Saturday date in YYYY-MM-DD format (empty = next weekend)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: "weekly-cd-pipeline"
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  sources:
    name: "Populate Sources"
    uses: ./.github/workflows/discover-sources.yml
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  events:
    name: "Populate Events"
    needs: [sources]
    uses: ./.github/workflows/update-events.yml
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    with:
      target_weekend: ${{ inputs.target_weekend || github.event.inputs.target_weekend || '' }}

  deploy-pages:
    name: "Deploy static site to GitHub Pages"
    needs: [events]
    if: always() && (needs.events.result == 'success' || needs.events.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        continue-on-error: true
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        continue-on-error: true
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

  release:
    name: "Create Weekly GitHub Release"
    needs: [events, deploy-pages]
    if: always() && (needs.events.result == 'success' || needs.events.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv & enable cache
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Sync dependencies via uv
        run: uv sync --frozen

      - name: Generate release summary notes
        id: notes
        run: uv run release-notes --output-file release_notes.md

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.notes.outputs.tag_name }}"
          TITLE="${{ steps.notes.outputs.release_title }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating release notes..."
            gh release edit "$TAG" --title "$TITLE" --notes-file release_notes.md
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" --title "$TITLE" --notes-file release_notes.md --target main
          fi
