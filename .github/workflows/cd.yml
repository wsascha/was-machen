name: "Continuous Deployment (CD)"

on:
  schedule:
    # Every Thursday at 06:00 UTC for weekly release
    - cron: "0 6 * * 4"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: "cd-pipeline"
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  deploy-pages:
    name: "Deploy static site to GitHub Pages"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: "Create Weekly GitHub Release"
    needs: [deploy-pages]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv & enable cache
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Sync dependencies via uv
        run: uv sync --frozen

      - name: Generate release summary notes
        id: notes
        run: uv run release-notes --output-file release_notes.md

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.notes.outputs.tag_name }}"
          TITLE="${{ steps.notes.outputs.release_title }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating release notes..."
            gh release edit "$TAG" --title "$TITLE" --notes-file release_notes.md
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" --title "$TITLE" --notes-file release_notes.md --target main
          fi
