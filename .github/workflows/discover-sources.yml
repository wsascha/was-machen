name: "Populate Sources"

on:
  schedule:
    # Run every Friday at 03:00 UTC
    - cron: "0 3 * * 5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run"
        required: false
        default: "false"
      max_sources:
        description: "Maximum number of new sources to discover and save"
        required: false
        default: "3"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "sources-pipeline"
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  populate-sources:
    name: "Discover & Populate Sources"
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token for PR & auto-merge
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install uv & enable cache
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Sync dependencies via uv
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest

      - name: Run autonomous source discovery and catalog population
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_SOURCES: ${{ github.event.inputs.max_sources || '3' }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            uv run discover-sources --dry-run
          else
            uv run discover-sources
          fi

      - name: Commit, create pull request and auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --local user.email "5718090+was-machen-bot[bot]@users.noreply.github.com"
          git config --local user.name "was-machen-bot[bot]"
          git add scripts/sources_config.json data/sources.json
          if git diff --staged --quiet; then
            echo "No new sources discovered or changed."
          else
            BRANCH="data/update-sources-$(date +%s)"
            git checkout -b "$BRANCH"
            git commit -m "chore(crawler): discover and populate event sources"
            git push origin "$BRANCH"
            PR_URL=$(gh pr create \
              --title "chore(crawler): discover and populate event sources" \
              --body "Automated source discovery pipeline added new regional event sources." \
              --base main \
              --head "$BRANCH")
            echo "Created PR: $PR_URL"
            if ! gh pr merge "$PR_URL" --auto --rebase --delete-branch 2>/dev/null; then
              gh pr merge "$PR_URL" --rebase --delete-branch
            fi
          fi
