name: "Populate Events"

on:
  workflow_call:
    inputs:
      target_weekend:
        description: "Target weekend Saturday date in YYYY-MM-DD format (empty = next weekend)"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      target_weekend:
        description: "Target weekend Saturday date in YYYY-MM-DD format (empty = next weekend)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "events-pipeline"
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  update-events:
    name: "Populate Weekend Events from Sources"
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token for PR & auto-merge
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Run multi-source aggregator and scoring
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TARGET_WEEKEND: ${{ inputs.target_weekend || github.event.inputs.target_weekend }}
        run: uv run update-events

      - name: Commit, create pull request and auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --local user.email "5718090+was-machen-bot[bot]@users.noreply.github.com"
          git config --local user.name "was-machen-bot[bot]"
          git add data/events.json data/sources.json
          if git diff --staged --quiet; then
            echo "No changes detected in data/events.json or data/sources.json."
          else
            BRANCH="data/update-events-$(date +%s)"
            git checkout -b "$BRANCH"
            git commit -m "chore(data): populate weekend events from sources"
            git push origin "$BRANCH"
            PR_URL=$(gh pr create \
              --title "chore(data): populate weekend events from sources" \
              --body "Automated weekend event crawler updated events and sources data." \
              --base main \
              --head "$BRANCH")
            echo "Created PR: $PR_URL"
            if ! gh pr merge "$PR_URL" --auto --rebase --delete-branch 2>/dev/null; then
              gh pr merge "$PR_URL" --rebase --delete-branch
            fi
            echo "Waiting for PR to merge..."
            for i in $(seq 1 30); do
              STATE=$(gh pr view "$PR_URL" --json state --jq .state)
              if [ "$STATE" = "MERGED" ]; then
                echo "PR $PR_URL successfully merged into main."
                break
              elif [ "$STATE" = "CLOSED" ]; then
                echo "PR $PR_URL was closed."
                break
              fi
              echo "Waiting for PR $PR_URL to merge (attempt $i/30)..."
              sleep 10
            done
          fi
