name: "Populate Events"

on:
  schedule:
    # Every Wednesday at 06:00 UTC for weekend planning
    - cron: "0 6 * * 3"
    # Every Friday at 05:00 UTC for a final update before the weekend
    - cron: "0 5 * * 5"
  workflow_dispatch:
    inputs:
      target_weekend:
        description: "Target weekend Saturday date in YYYY-MM-DD format (empty = next weekend)"
        required: false
        default: ""
  workflow_call:
    inputs:
      target_weekend:
        description: "Target weekend Saturday date in YYYY-MM-DD format (empty = next weekend)"
        type: string
        required: false
        default: ""
    secrets:
      GEMINI_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false

permissions:
  contents: write

concurrency:
  group: "events-pipeline"
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  update-events:
    name: "Populate Weekend Events from Sources"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Run multi-source aggregator and scoring
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TARGET_WEEKEND: ${{ inputs.target_weekend || github.event.inputs.target_weekend }}
        run: uv run update-events

      - name: Commit and push updated event database
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/events.json data/sources.json
          if git diff --staged --quiet; then
            echo "No changes detected in data/events.json or data/sources.json."
          else
            git commit -m "chore(data): populate weekend events from sources [skip ci]"
            git push
          fi
