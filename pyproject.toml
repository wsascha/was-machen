[project]
name = "was-machen-wir-am-wochenende"
version = "0.1.0"
description = "Curated family weekend guide around 77815 Bühl, Germany (max 60-minute driving radius: Baden, Black Forest, Alsace) for kids aged 4 to 9."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "feedparser>=6.0.11",
    "google-genai>=1.0.0",
    "lxml>=5.2.0",
    "pydantic-settings>=2.16.2",
    "python-dateutil>=2.9.0",
    "requests>=2.32.0",
]

[project.scripts]
discover-sources = "scripts.discover_sources:main"
release-notes = "scripts.release_notes:main"
update-events = "scripts.update_events:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.8.0",
]

[tool.rumdl]
disable = ["MD013", "MD041"]

[tool.pytest.ini_options]
pythonpath = ["."]
